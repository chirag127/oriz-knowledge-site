# Test — run the Vitest suite on push + PR.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve file deps to npm registry
        run: sed -i 's|"file:\.\./design-system/packages/oz-ai"|"^0.3.1"|g' package.json

      - run: npm install --legacy-peer-deps

      - run: npm test
